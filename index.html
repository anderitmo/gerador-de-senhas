<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas & PINs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1>KeyCraft</h1>
      </div>
      <p class="subtitle">Gerador seguro de senhas e PINs personalizados</p>
    </header>

    <main class="main-content">
      <!-- Coluna Esquerda: Histórico de Senhas -->
      <section class="card history-card">
        <div class="history-header">
          <div class="history-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <h2>Histórico Recente</h2>
          </div>
          <button id="clearHistoryBtn" class="btn btn-ghost text-danger" title="Excluir todo o histórico">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Limpar tudo
          </button>
        </div>

        <div id="historyList" class="history-list">
          <!-- Itens do histórico serão inseridos dinamicamente aqui -->
        </div>
      </section>

      <!-- Coluna Direita: Gerador de Senhas -->
      <section class="card generator-card">
        <!-- Display da Senha Gerada -->
        <div class="display-box">
          <div class="password-output" id="passwordOutput" title="Clique para copiar">
            <span id="passwordText" class="password-text"></span>
          </div>
          <div class="display-actions">
            <button id="toggleVisibilityBtn" class="icon-btn" title="Ocultar/Mostrar senha" aria-label="Ocultar/Mostrar senha">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <button id="copyBtn" class="btn btn-primary btn-copy" title="Copiar para a área de transferência">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copiar</span>
            </button>
          </div>
        </div>

        <!-- Indicador de Força -->
        <div class="strength-meter-container">
          <div class="strength-info">
            <span class="label">Força da Senha:</span>
            <span id="strengthText" class="strength-text">N/A</span>
          </div>
          <div class="strength-bars" id="strengthBars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>

        <!-- Seletor de Modo Rápido -->
        <div class="mode-selector">
          <button type="button" class="mode-btn active" data-mode="custom">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            Senha Customizada
          </button>
          <button type="button" class="mode-btn" data-mode="pin">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><circle cx="9" cy="9" r="1"></circle><circle cx="15" cy="9" r="1"></circle><circle cx="9" cy="15" r="1"></circle><circle cx="15" cy="15" r="1"></circle></svg>
            PIN Apenas Números
          </button>
        </div>

        <!-- Controles da Senha -->
        <div class="controls-group">
          <!-- Controle do Tamanho -->
          <div class="control-item length-control">
            <div class="control-header">
              <label for="lengthSlider">Tamanho da senha</label>
              <span id="lengthValue" class="length-badge">10</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="lengthSlider" min="4" max="64" value="10" step="1">
            </div>
          </div>

          <!-- Opções de Caracteres -->
          <div class="control-item options-grid" id="optionsGrid">
            <label class="checkbox-container">
              <input type="checkbox" id="chkNumbers" checked>
              <span class="checkmark"></span>
              <span class="option-label">Números <small>(0-9)</small></span>
            </label>

            <label class="checkbox-container">
              <input type="checkbox" id="chkUppercase" checked>
              <span class="checkmark"></span>
              <span class="option-label">Letras Maiúsculas <small>(A-Z)</small></span>
            </label>

            <label class="checkbox-container">
              <input type="checkbox" id="chkLowercase" checked>
              <span class="checkmark"></span>
              <span class="option-label">Letras Minúsculas <small>(a-z)</small></span>
            </label>

            <label class="checkbox-container">
              <input type="checkbox" id="chkSymbols" checked>
              <span class="checkmark"></span>
              <span class="option-label">Símbolos <small>(!@#$%...)</small></span>
            </label>
          </div>
        </div>

        <!-- Botão Gerar -->
        <button id="generateBtn" class="btn btn-action">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          Gerar Nova Senha
        </button>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Copiado para a área de transferência!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
